<style>
  :root {
    --bg: #070b10;
    --panel: #0d1420;
    --panel2: #0a0f16;
    --border: #1c2b3a;
    --border-bright: #244356;
    --text: #d7f7e2;
    --muted: #5f7a72;
    --green: #39ff6a;
    --green-dim: #1f8f44;
    --cyan: #00e5ff;
    --ok: #39ff6a;
    --err: #ff4d6d;
    --console-bg: #020403;
    --console-fg: #39ff6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: "SF Mono", "Consolas", "Roboto Mono", monospace;
    overflow-x: hidden; position: relative;
  }

  #matrixCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; opacity: 0.16; pointer-events: none;
  }
  .scanlines {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1; pointer-events: none; mix-blend-mode: overlay;
    background: repeating-linear-gradient(
      to bottom, rgba(57,255,106,0.035) 0px, rgba(57,255,106,0.035) 1px,
      transparent 1px, transparent 3px
    );
  }
  .vignette {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1; pointer-events: none;
    box-shadow: inset 0 0 140px 40px rgba(0,0,0,0.75);
  }

  header, main { position: relative; z-index: 2; }

  header {
    padding: 20px 16px 14px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, rgba(7,11,16,0.97) 0%, rgba(7,11,16,0.9) 100%);
    backdrop-filter: blur(6px);
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand-icon {
    width: 34px; height: 34px; border-radius: 8px; display: block;
    filter: drop-shadow(0 0 6px rgba(57,255,106,0.6));
  }
  header h1 {
    margin: 0; font-size: 21px; letter-spacing: 1.5px; font-weight: 800;
    color: var(--green); text-shadow: 0 0 10px rgba(57,255,106,0.55), 0 0 2px rgba(57,255,106,0.9);
  }
  header p {
    margin: 6px 0 0; color: var(--cyan); font-size: 11px; letter-spacing: 0.4px;
    opacity: 0.85;
  }
  header p::before { content: "> "; color: var(--green); }

  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--panel2); }
  .tab {
    flex: 1; text-align: center; padding: 13px 4px; cursor: pointer;
    color: var(--muted); font-size: 14px; font-weight: 700; letter-spacing: 1px;
    border-bottom: 3px solid transparent; text-transform: uppercase;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab.active {
    color: var(--green); border-bottom-color: var(--green);
    text-shadow: 0 0 8px rgba(57,255,106,0.6);
  }

  main { padding: 18px 16px 40px; max-width: 640px; margin: 0 auto; }

  label.field-label {
    display: block; margin: 16px 0 6px; font-size: 11px; letter-spacing: 0.6px;
    color: var(--cyan); font-weight: 700; text-transform: uppercase;
  }
  label.field-label::before { content: "> "; color: var(--green); }

  select, textarea, input[type=file] {
    width: 100%; padding: 11px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px;
    font-family: inherit;
  }
  select:focus, textarea:focus {
    outline: none; border-color: var(--green); box-shadow: 0 0 0 2px rgba(57,255,106,0.15);
  }
  textarea { resize: vertical; min-height: 80px; }
  input[type=file] { padding: 9px; color: var(--muted); }
  input[type=file]::file-selector-button {
    background: var(--border-bright); color: var(--cyan); border: none;
    padding: 7px 12px; border-radius: 4px; margin-right: 10px; font-family: inherit;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }

  button.primary {
    width: 100%; margin-top: 20px; padding: 15px; border: 1px solid var(--green);
    border-radius: 8px; background: linear-gradient(180deg, #123a22, #0c2417);
    color: var(--green); font-size: 15px; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase; cursor: pointer;
    box-shadow: 0 0 14px rgba(57,255,106,0.25), inset 0 0 12px rgba(57,255,106,0.08);
  }
  button.primary:active { background: #1a4e2d; }
  button.primary:disabled { opacity: 0.45; box-shadow: none; }

  .note {
    margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.5;
    background: var(--panel); border: 1px solid var(--border); border-left: 2px solid var(--cyan);
    border-radius: 4px; padding: 8px 10px;
  }

  .progress-wrap { margin-top: 20px; }
  .progress-label {
    font-size: 11px; color: var(--cyan); margin-bottom: 6px; letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .progress-label::before { content: "> "; color: var(--green); }
  .progress-bar-bg {
    width: 100%; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-bar-fill {
    height: 100%; width: 0%; transition: width 0.15s;
    background: linear-gradient(90deg, var(--green-dim), var(--green));
    box-shadow: 0 0 8px rgba(57,255,106,0.7);
  }

  .result-box {
    margin-top: 18px; padding: 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); display: none;
  }
  .result-box.show { display: block; }
  .result-box.ok { border-color: var(--ok); box-shadow: 0 0 16px rgba(57,255,106,0.15); }
  .result-box.err { border-color: var(--err); box-shadow: 0 0 16px rgba(255,77,109,0.15); }
  .result-box h3 {
    margin: 0 0 10px; font-size: 13px; letter-spacing: 0.6px; text-transform: uppercase;
  }
  .result-box.ok h3 { color: var(--green); }
  .result-box.err h3 { color: var(--err); }
  .result-box img {
    max-width: 100%; border-radius: 6px; display: block; margin: 8px 0;
    border: 1px solid var(--border);
  }
  .result-box textarea.readout {
    background: var(--console-bg); min-height: 70px; color: var(--green);
    border-color: var(--border-bright);
  }

  a.download-btn {
    display: inline-block; margin-top: 10px; padding: 11px 18px; border-radius: 6px;
    background: var(--green); color: #06240f; font-weight: 800; text-decoration: none;
    font-size: 13px; letter-spacing: 0.6px; text-transform: uppercase;
    box-shadow: 0 0 12px rgba(57,255,106,0.4);
  }

  details.console-wrap { margin-top: 24px; }
  summary {
    cursor: pointer; color: var(--cyan); font-size: 11px; padding: 8px 0;
    letter-spacing: 0.6px; text-transform: uppercase; list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; color: var(--green); }
  details[open] summary::before { content: "▾ "; }
  #console {
    margin-top: 8px; background: var(--console-bg); color: var(--console-fg);
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px;
    padding: 12px; border-radius: 6px; height: 180px; overflow-y: auto; white-space: pre-wrap;
    border: 1px solid var(--border-bright); box-shadow: inset 0 0 16px rgba(0,0,0,0.5);
  }
</style>
</head>

(function () {

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w / 16);
    drops = new Array(cols).fill(1);
  }
  window.addEventListener("resize", resize);
  resize();

  function draw() {
    ctx.fillStyle = "rgba(7,11,16,0.08)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#39ff6a";
    ctx.font = "14px monospace";

      ctx.fillText(text, i * 16, drops[i] * 16);

<script>
"use strict";

/* ---------------------------------------------------------------------- */
/* Shared bit-packing helpers (mirrors the desktop Python tool's format)  */
/* ---------------------------------------------------------------------- */

const HEADER_BITS = 32;

function bytesToBits(bytes) {
  const bits = new Uint8Array(bytes.length * 8);
  let idx = 0;
  for (let i = 0; i < bytes.length; i++) {
    const b = bytes[i];
    for (let j = 7; j >= 0; j--) bits[idx++] = (b >> j) & 1;
  }
  return bits;
}

function bitsToBytes(bits) {
  const out = new Uint8Array(Math.floor(bits.length / 8));
  for (let i = 0; i < out.length; i++) {
    let byte = 0;
    for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i * 8 + j];
    out[i] = byte;
  }
  return out;
}

function packPayload(bytes) {
  const len = bytes.length;
  const out = new Uint8Array(4 + bytes.length);
  out[0] = (len >>> 24) & 0xff;
  out[1] = (len >>> 16) & 0xff;
  out[2] = (len >>> 8) & 0xff;
  out[3] = len & 0xff;
  out.set(bytes, 4);
  return out;
}

function unpackLength(headerBytes) {
  return ((headerBytes[0] << 24) | (headerBytes[1] << 16) | (headerBytes[2] << 8) | headerBytes[3]) >>> 0;
}


/* ---------------------------------------------------------------------- */
/* Optional password encryption: AES-256-GCM + PBKDF2-HMAC-SHA256         */
/* Blob: "SGE1" | salt(16) | nonce(12) | ciphertext+tag  (same as desktop) */
/* ---------------------------------------------------------------------- */

const MAGIC = new Uint8Array([0x53, 0x47, 0x45, 0x31]); // "SGE1"
const KDF_ITERATIONS = 200000;

function requireCrypto() {
  if (!window.crypto || !crypto.subtle) {
    throw new Error("Encryption needs a secure context. Open this file directly from your phone's storage (file://) or over https — not over plain http:// on a network address.");
  }
}

async function deriveKey(password, salt) {
  requireCrypto();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: KDF_ITERATIONS, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}

async function encryptBytes(data, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const nonce = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: nonce, additionalData: MAGIC }, key, data));
  const out = new Uint8Array(4 + 16 + 12 + ct.length);
  out.set(MAGIC, 0); out.set(salt, 4); out.set(nonce, 20); out.set(ct, 32);
  return out;
}

async function decryptBytes(blob, password) {
  if (blob.length < 4 + 16 + 12 + 16) throw new Error("Encrypted data is truncated.");
  const key = await deriveKey(password, blob.slice(4, 20));
  try {
    return new Uint8Array(await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: blob.slice(20, 32), additionalData: MAGIC }, key, blob.slice(32)));
  } catch (e) {
    throw new Error("Wrong password, or the data was altered/corrupted.");
  }
}

function hasMagic(b) { return b.length >= 4 && b[0] === 0x53 && b[1] === 0x47 && b[2] === 0x45 && b[3] === 0x31; }

async function sealBytes(data, password) { return password ? encryptBytes(data, password) : data; }

async function openBytes(data, password) {
  if (!hasMagic(data)) return data;
  if (!password) throw new Error("This content is password-protected. Enter the password.");
  return decryptBytes(data, password);
}

async function openText(data, password) {
  const plain = await openBytes(data, password);
  try { return new TextDecoder("utf-8", { fatal: true }).decode(plain); }
  catch (e) { throw new Error("No readable hidden message found in this file."); }
}

function bytesToB64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

function b64ToBytes(str) {
  let bin;
  try { bin = atob(str.replace(/\s+/g, "")); } catch (e) { throw new Error("That doesn't look like an encrypted message (bad base64)."); }
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function encryptText(message, password) {
  if (!password) throw new Error("A password is required for text encryption.");
  return bytesToB64(await encryptBytes(new TextEncoder().encode(message), password));
}

async function decryptText(token, password) {
  if (!password) throw new Error("A password is required to decrypt.");
  const blob = b64ToBytes(token);
  if (!hasMagic(blob)) throw new Error("That doesn't look like an encrypted message from this tool.");
  return new TextDecoder().decode(await decryptBytes(blob, password));
}

/* ---------------------------------------------------------------------- */
/* WAV parsing / writing (16/8/32-bit PCM, mono or multi-channel)         */
/* ---------------------------------------------------------------------- */

function parseWav(arrayBuffer) {
  const dv = new DataView(arrayBuffer);
  if (dv.getUint32(0, false) !== 0x52494646) throw new Error("Not a RIFF/WAV file.");
  if (dv.getUint32(8, false) !== 0x57415645) throw new Error("Not a WAVE file.");
  let offset = 12;
  let fmt = null, dataOffset = -1, dataLength = 0;
  while (offset + 8 <= arrayBuffer.byteLength) {
    const id = String.fromCharCode(dv.getUint8(offset), dv.getUint8(offset+1), dv.getUint8(offset+2), dv.getUint8(offset+3));
    const size = dv.getUint32(offset + 4, true);
    const body = offset + 8;
    if (id === "fmt ") {
      fmt = {
        audioFormat: dv.getUint16(body, true),
        numChannels: dv.getUint16(body + 2, true),
        sampleRate: dv.getUint32(body + 4, true),
        byteRate: dv.getUint32(body + 8, true),
        blockAlign: dv.getUint16(body + 12, true),
        bitsPerSample: dv.getUint16(body + 14, true),
      };
    } else if (id === "data") {
      dataOffset = body;
      dataLength = size;
    }
    offset = body + size + (size % 2);
  }
  if (!fmt || dataOffset < 0) throw new Error("Invalid WAV file: missing fmt or data chunk.");
  if (![8, 16, 32].includes(fmt.bitsPerSample)) throw new Error(`Unsupported bits-per-sample: ${fmt.bitsPerSample}`);
  const dataBuf = arrayBuffer.slice(dataOffset, dataOffset + dataLength);
  let samples;
  if (fmt.bitsPerSample === 8) samples = new Uint8Array(dataBuf);
  else if (fmt.bitsPerSample === 16) samples = new Int16Array(dataBuf);
  else samples = new Int32Array(dataBuf);
  return { fmt, samples };
}

function writeWav(fmt, samples) {
  const bytesPerSample = fmt.bitsPerSample / 8;
  const dataLength = samples.length * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataLength);
  const dv = new DataView(buffer);
  function writeStr(off, str) { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); }
  writeStr(0, "RIFF");
  dv.setUint32(4, 36 + dataLength, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); // PCM
  dv.setUint16(22, fmt.numChannels, true);
  dv.setUint32(24, fmt.sampleRate, true);
  dv.setUint32(28, fmt.byteRate, true);
  dv.setUint16(32, fmt.blockAlign, true);
  dv.setUint16(34, fmt.bitsPerSample, true);
  writeStr(36, "data");
  dv.setUint32(40, dataLength, true);
  new Uint8Array(buffer, 44).set(new Uint8Array(samples.buffer, samples.byteOffset, samples.byteLength));
  return buffer;
}

function embedBitsIntoSamples(samples, bits) {
  for (let i = 0; i < bits.length; i++) samples[i] = (samples[i] & ~1) | bits[i];
}

/* ---------------------------------------------------------------------- */
/* Image helpers (RGB-only, alpha untouched — matches desktop's 3-channel */
/* layout so files stay cross-compatible with the desktop tool)           */
/* ---------------------------------------------------------------------- */

function blobToDataURL(blob) {
  // data: URIs work for both display and <a download> regardless of the
  // page's origin. blob: object URLs are blocked for downloads on Android
  // Chrome when the page is opened via file:// (opaque/null origin) —
  // that's the "URL needs to be http or https" error — so data: URIs are
  // used everywhere instead of URL.createObjectURL.
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function loadImageFile(file) {
  return new Promise(async (resolve, reject) => {
    try {
      const dataUrl = await blobToDataURL(file);
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Could not load image file."));
      img.src = dataUrl;
    } catch (e) {
      reject(e);
    }
  });
}

function imageToCanvas(img) {
  const canvas = document.createElement("canvas");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext("2d");
  // Opaque backdrop: canvas stores premultiplied alpha, which would silently
  // corrupt the RGB LSBs of any transparent/semi-transparent pixel.
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0);
  return canvas;
}

function flattenRGB(imageData) {
  const { data, width, height } = imageData;
  const pixelCount = width * height;
  const flat = new Uint8Array(pixelCount * 3);
  for (let p = 0, j = 0; p < pixelCount; p++) {
    flat[j++] = data[p * 4 + 0];
    flat[j++] = data[p * 4 + 1];
    flat[j++] = data[p * 4 + 2];
  }
  return flat;
}

function writeFlatRGBBack(imageData, flat) {
  const { data, width, height } = imageData;
  const pixelCount = width * height;
  for (let p = 0, j = 0; p < pixelCount; p++) {
    data[p * 4 + 0] = flat[j++];
    data[p * 4 + 1] = flat[j++];
    data[p * 4 + 2] = flat[j++];
  }
}

function canvasToPngBlob(canvas) {
  return new Promise((resolve) => canvas.toBlob((b) => resolve(b), "image/png"));
}

function blobToArrayBuffer(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(blob);
  });
}

/* ---------------------------------------------------------------------- */
/* Logging / progress                                                     */
/* ---------------------------------------------------------------------- */

const consoleEl = document.getElementById("console");
const progressLabel = document.getElementById("progressLabel");
const progressFill = document.getElementById("progressFill");

function log(msg) {
  const ts = new Date().toLocaleTimeString();
  consoleEl.textContent += `[${ts}] ${msg}\n`;
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

function setProgress(fraction, label) {
  progressFill.style.width = `${Math.max(0, Math.min(100, fraction * 100))}%`;
  if (label) progressLabel.textContent = label;
}

function showResult(kind, html) {
  const box = document.getElementById("resultBox");
  box.className = `result-box show ${kind}`;
  box.innerHTML = html;
}

function clearResult() {
  const box = document.getElementById("resultBox");
  box.className = "result-box";
  box.innerHTML = "";
}

// setTimeout, not requestAnimationFrame: rAF never fires while the tab is in the background.
function yieldToUI() { return new Promise((r) => setTimeout(r, 0)); }

/* ---------------------------------------------------------------------- */
/* Core operations                                                        */
/* ---------------------------------------------------------------------- */

async function encodeMessageInImage(file, message, password) {
  log(`Loading image: ${file.name}`);
  setProgress(0.05, "Loading image...");
  const img = await loadImageFile(file);
  const canvas = imageToCanvas(img);
  const ctx = canvas.getContext("2d");
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const flat = flattenRGB(imageData);

  const payload = packPayload(await sealBytes(new TextEncoder().encode(message), password));
  const bits = bytesToBits(payload);
  log(`Payload size: ${payload.length} bytes (${bits.length} bits)`);
  if (bits.length > flat.length) {
    throw new Error(`Message too large for this image. Capacity: ${Math.floor(flat.length/8)} bytes, needed: ${Math.floor(bits.length/8)} bytes.`);
  }

  setProgress(0.3, "Embedding bits...");
  for (let i = 0; i < flat.length; i++) if (i < bits.length) flat[i] = (flat[i] & 0xfe) | bits[i];
  await yieldToUI();

  writeFlatRGBBack(imageData, flat);
  ctx.putImageData(imageData, 0, 0);
  setProgress(0.8, "Encoding PNG...");
  const blob = await canvasToPngBlob(canvas);
  setProgress(1.0, "Done.");
  log("Encode complete.");
  return blob;
}

async function decodeMessageFromImage(file, password) {
  log(`Loading image: ${file.name}`);
  setProgress(0.1, "Loading image...");
  const img = await loadImageFile(file);
  const canvas = imageToCanvas(img);
  const ctx = canvas.getContext("2d");
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const flat = flattenRGB(imageData);

  setProgress(0.4, "Reading header...");
  const headerBits = new Uint8Array(HEADER_BITS);
  for (let i = 0; i < HEADER_BITS; i++) headerBits[i] = flat[i] & 1;
  const length = unpackLength(bitsToBytes(headerBits));
  log(`Header reports payload length: ${length} bytes`);

  const totalBits = HEADER_BITS + length * 8;
  if (totalBits > flat.length) throw new Error("Image does not contain a valid embedded message.");

  setProgress(0.7, "Extracting payload...");
  const payloadBits = new Uint8Array(length * 8);
  for (let i = 0; i < payloadBits.length; i++) payloadBits[i] = flat[HEADER_BITS + i] & 1;
  const data = bitsToBytes(payloadBits);
  setProgress(1.0, "Done.");
  log("Decode complete.");
  return await openText(data, password);
}

async function encodeMessageInAudio(file, message, password) {
  log(`Loading audio: ${file.name}`);
  setProgress(0.05, "Loading audio...");
  const buf = await blobToArrayBuffer(file);
  const { fmt, samples } = parseWav(buf);
  log(`WAV: ${fmt.numChannels}ch, ${fmt.sampleRate}Hz, ${fmt.bitsPerSample}-bit`);

  const payload = packPayload(await sealBytes(new TextEncoder().encode(message), password));
  const bits = bytesToBits(payload);
  log(`Payload size: ${payload.length} bytes (${bits.length} bits)`);
  if (bits.length > samples.length) {
    throw new Error(`Message too large for this audio file. Capacity: ${Math.floor(samples.length/8)} bytes, needed: ${Math.floor(bits.length/8)} bytes.`);
  }

  setProgress(0.4, "Embedding bits...");
  embedBitsIntoSamples(samples, bits);
  await yieldToUI();

  setProgress(0.85, "Writing WAV...");
  const outBuf = writeWav(fmt, samples);
  setProgress(1.0, "Done.");
  log("Encode complete.");
  return new Blob([outBuf], { type: "audio/wav" });
}

async function decodeMessageFromAudio(file, password) {
  log(`Loading audio: ${file.name}`);
  setProgress(0.1, "Loading audio...");
  const buf = await blobToArrayBuffer(file);
  const { fmt, samples } = parseWav(buf);
  log(`WAV: ${fmt.numChannels}ch, ${fmt.sampleRate}Hz, ${fmt.bitsPerSample}-bit`);

  setProgress(0.4, "Reading header...");
  const headerBits = new Uint8Array(HEADER_BITS);
  for (let i = 0; i < HEADER_BITS; i++) headerBits[i] = samples[i] & 1;
  const length = unpackLength(bitsToBytes(headerBits));
  log(`Header reports payload length: ${length} bytes`);

  const totalBits = HEADER_BITS + length * 8;
  if (totalBits > samples.length) throw new Error("Audio file does not contain a valid embedded message.");

  setProgress(0.7, "Extracting payload...");
  const payloadBits = new Uint8Array(length * 8);
  for (let i = 0; i < payloadBits.length; i++) payloadBits[i] = samples[HEADER_BITS + i] & 1;
  const data = bitsToBytes(payloadBits);
  setProgress(1.0, "Done.");
  log("Decode complete.");
  return await openText(data, password);
}

async function encodeImageInAudio(imageFile, audioFile, password) {
  log(`Loading image: ${imageFile.name}`);
  setProgress(0.05, "Loading image...");
  const img = await loadImageFile(imageFile);
  const canvas = imageToCanvas(img);
  const pngBlob = await canvasToPngBlob(canvas);
  const pngBytes = new Uint8Array(await blobToArrayBuffer(pngBlob));
  log(`Encoded image to PNG: ${pngBytes.length} bytes`);

  log(`Loading audio: ${audioFile.name}`);
  setProgress(0.15, "Loading audio...");
  const buf = await blobToArrayBuffer(audioFile);
  const { fmt, samples } = parseWav(buf);
  log(`WAV: ${fmt.numChannels}ch, ${fmt.sampleRate}Hz, ${fmt.bitsPerSample}-bit`);

  const payload = packPayload(await sealBytes(pngBytes, password));
  const bits = bytesToBits(payload);
  log(`Payload size: ${payload.length} bytes (${bits.length} bits)`);
  if (bits.length > samples.length) {
    throw new Error(`Image too large for this audio file. Capacity: ${Math.floor(samples.length/8)} bytes, needed: ${Math.floor(bits.length/8)} bytes. Try a smaller image or longer audio.`);
  }

  setProgress(0.4, "Embedding bits...");
  embedBitsIntoSamples(samples, bits);
  await yieldToUI();

  setProgress(0.85, "Writing WAV...");
  const outBuf = writeWav(fmt, samples);
  setProgress(1.0, "Done.");
  log("Encode complete.");
  return new Blob([outBuf], { type: "audio/wav" });
}

async function decodeImageFromAudio(audioFile, password) {
  log(`Loading audio: ${audioFile.name}`);
  setProgress(0.1, "Loading audio...");
  const buf = await blobToArrayBuffer(audioFile);
  const { fmt, samples } = parseWav(buf);
  log(`WAV: ${fmt.numChannels}ch, ${fmt.sampleRate}Hz, ${fmt.bitsPerSample}-bit`);

  setProgress(0.3, "Reading header...");
  const headerBits = new Uint8Array(HEADER_BITS);
  for (let i = 0; i < HEADER_BITS; i++) headerBits[i] = samples[i] & 1;
  const length = unpackLength(bitsToBytes(headerBits));
  log(`Header reports payload length: ${length} bytes`);

  const totalBits = HEADER_BITS + length * 8;
  if (totalBits > samples.length) throw new Error("Audio file does not contain a valid embedded image.");

  setProgress(0.6, "Extracting payload...");
  const payloadBits = new Uint8Array(length * 8);
  for (let i = 0; i < payloadBits.length; i++) payloadBits[i] = samples[HEADER_BITS + i] & 1;
  const data = bitsToBytes(payloadBits);
  setProgress(1.0, "Done.");
  log("Decode complete.");
  return new Blob([await openBytes(data, password)], { type: "image/png" });
}

/* ---------------------------------------------------------------------- */
/* UI wiring                                                              */
/* ---------------------------------------------------------------------- */

let currentMode = "encode"; // encode | decode

const tabs = document.querySelectorAll(".tab");
const toolSelect = document.getElementById("toolSelect");
const fieldsEl = document.getElementById("fields");
const runBtn = document.getElementById("runBtn");

tabs.forEach((tab) => {
  tab.addEventListener("click", () => {
    tabs.forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    currentMode = tab.dataset.mode;
    runBtn.textContent = currentMode === "encode" ? "Encode" : "Decode";
    renderFields();
  });
});

toolSelect.addEventListener("change", renderFields);

function renderFields() {
  clearResult();
  setProgress(0, "Idle");
  const tool = toolSelect.value;
  let html = "";

  if (tool === "text") {
    html += `<label class="field-label">${currentMode === "encode" ? "Message to encrypt" : "Cipher text to decrypt"}</label>
      <textarea id="f_message" placeholder="${currentMode === "encode" ? "Secret message..." : "Paste the encrypted text here..."}"></textarea>
      <div class="note">AES-256-GCM. Paste the result into any chat app — the other person decrypts it here (or in the desktop tool) with the same password.</div>`;
  } else if (tool === "msgImage") {
    html += `<label class="field-label">${currentMode === "encode" ? "Source image" : "Image with hidden message"}</label>
      <input type="file" id="f_image" accept="image/*">`;
    if (currentMode === "encode") {
      html += `<label class="field-label">Message</label><textarea id="f_message" placeholder="Secret message..."></textarea>`;
    }
    html += `<div class="note">Output is always PNG (lossless) — any lossy save would destroy the hidden bits.</div>`;
    html += `<div class="note" style="border-left-color:var(--err)">⚠ Sending this image through WhatsApp, Messenger, Instagram etc. as a normal "Photo" will re-compress it and destroy the hidden message. Always send/receive it as a <strong>Document / File</strong> attachment instead.</div>`;
  } else if (tool === "msgAudio") {
    html += `<label class="field-label">${currentMode === "encode" ? "Source audio (WAV)" : "Audio with hidden message (WAV)"}</label>
      <input type="file" id="f_audio" accept="audio/wav,.wav">`;
    if (currentMode === "encode") {
      html += `<label class="field-label">Message</label><textarea id="f_message" placeholder="Secret message..."></textarea>`;
    }
    html += `<div class="note">WAV (PCM) only on this mobile version — no built-in audio transcoder.</div>`;
  } else if (tool === "imgAudio") {
    if (currentMode === "encode") {
      html += `<label class="field-label">Image to hide</label><input type="file" id="f_image" accept="image/*">
        <label class="field-label">Source audio (WAV)</label><input type="file" id="f_audio" accept="audio/wav,.wav">`;
    } else {
      html += `<label class="field-label">Audio with hidden image (WAV)</label><input type="file" id="f_audio" accept="audio/wav,.wav">`;
    }
    html += `<div class="note">WAV (PCM) only on this mobile version — no built-in audio transcoder.</div>`;
  }

  html += `<label class="field-label">Password ${tool === "text" ? "(required)" : "(optional — encrypts the hidden data)"}</label>
    <input type="password" id="f_password" autocomplete="off" placeholder="${tool === "text" ? "Shared secret" : "Leave empty for no encryption"}">`;

  fieldsEl.innerHTML = html;
}

runBtn.addEventListener("click", async () => {
  clearResult();
  consoleEl.textContent = "";
  runBtn.disabled = true;
  setProgress(0, "Starting...");
  const tool = toolSelect.value;
  const password = document.getElementById("f_password").value;
  try {
    if (tool === "text") {
      const input = document.getElementById("f_message").value.trim();
      if (!input) throw new Error("Please enter some text.");
      setProgress(0.3, currentMode === "encode" ? "Encrypting..." : "Decrypting...");
      await yieldToUI();
      const out = currentMode === "encode" ? await encryptText(input, password) : await decryptText(input, password);
      setProgress(1, "Done.");
      showResult("ok", `<h3>✅ ${currentMode === "encode" ? "Encrypted text" : "Decrypted message"}</h3>
        <textarea class="readout" id="textOut" readonly>${escapeHtml(out)}</textarea>
        <a class="download-btn" href="#" id="copyBtn">Copy</a>
        ${navigator.share ? ' <a class="download-btn" href="#" id="shareBtn">Share</a>' : ""}`);
      document.getElementById("copyBtn").onclick = async (ev) => {
        ev.preventDefault();
        const el = document.getElementById("textOut");
        try { await navigator.clipboard.writeText(out); } catch (e) { el.select(); document.execCommand("copy"); }
        ev.target.textContent = "Copied!";
      };
      const sb = document.getElementById("shareBtn");
      if (sb) sb.onclick = (ev) => { ev.preventDefault(); navigator.share({ text: out }).catch(() => {}); };
    } else if (tool === "msgImage") {
      const file = document.getElementById("f_image").files[0];
      if (!file) throw new Error("Please choose an image.");
      if (currentMode === "encode") {
        const message = document.getElementById("f_message").value;
        if (!message) throw new Error("Please enter a message.");
        const blob = await encodeMessageInImage(file, message, password);
        const url = await blobToDataURL(blob);
        showResult("ok", `<h3>✅ Encoded</h3><img src="${url}"><a class="download-btn" href="${url}" download="encoded.png">Download encoded.png</a>${saveHint()}`);
      } else {
        const message = await decodeMessageFromImage(file, password);
        showResult("ok", `<h3>✅ Decoded message</h3><textarea class="readout" readonly>${escapeHtml(message)}</textarea>`);
      }
    } else if (tool === "msgAudio") {
      const file = document.getElementById("f_audio").files[0];
      if (!file) throw new Error("Please choose an audio file.");
      if (currentMode === "encode") {
        const message = document.getElementById("f_message").value;
        if (!message) throw new Error("Please enter a message.");
        const blob = await encodeMessageInAudio(file, message, password);
        const url = await blobToDataURL(blob);
        showResult("ok", `<h3>✅ Encoded</h3><audio controls src="${url}" style="width:100%"></audio><a class="download-btn" href="${url}" download="encoded.wav">Download encoded.wav</a>${saveHint()}`);
      } else {
        const message = await decodeMessageFromAudio(file, password);
        showResult("ok", `<h3>✅ Decoded message</h3><textarea class="readout" readonly>${escapeHtml(message)}</textarea>`);
      }
    } else if (tool === "imgAudio") {
      if (currentMode === "encode") {
        const imageFile = document.getElementById("f_image").files[0];
        const audioFile = document.getElementById("f_audio").files[0];
        if (!imageFile || !audioFile) throw new Error("Please choose both an image and an audio file.");
        const blob = await encodeImageInAudio(imageFile, audioFile, password);
        const url = await blobToDataURL(blob);
        showResult("ok", `<h3>✅ Encoded</h3><audio controls src="${url}" style="width:100%"></audio><a class="download-btn" href="${url}" download="encoded.wav">Download encoded.wav</a>${saveHint()}`);
      } else {
        const audioFile = document.getElementById("f_audio").files[0];
        if (!audioFile) throw new Error("Please choose an audio file.");
        const blob = await decodeImageFromAudio(audioFile, password);
        const url = await blobToDataURL(blob);
        showResult("ok", `<h3>✅ Extracted image</h3><img src="${url}"><a class="download-btn" href="${url}" download="extracted.png">Download extracted.png</a>${saveHint()}`);
      }
    }
  } catch (e) {
    log(`ERROR: ${e.message}`);
    setProgress(0, "Failed.");
    showResult("err", `<h3>❌ Failed</h3><div>${escapeHtml(e.message)}</div>`);
  } finally {
    runBtn.disabled = false;
  }
});

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function saveHint() {
  return `<div class="note" style="margin-top:12px">If tapping "Download" doesn't save a file, long-press the image/audio above and choose "Download" / "Save" from the menu that appears — this works even when the download button is blocked by the browser.</div>`;
}

renderFields();
</script>
</body>
</html>
